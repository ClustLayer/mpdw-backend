[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

# En Docker host típico se usa tail de /var/lib/docker/containers o el driver del runtime.
# Aquí se deja un input stub; adaptar al despliegue real.

[OUTPUT]
    Name   loki
    Match  *
    Host   loki
    Port   3100
    Labels job=mpdw,environment=dev