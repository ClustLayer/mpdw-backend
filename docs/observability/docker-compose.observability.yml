# Referencia del informe de logs (Fluent Bit → Loki → Grafana).
# No incluye Mongo Atlas (se usa vía MONGODB_*_URI en .env).
# Uso: docker compose -f docs/observability/docker-compose.observability.yml up -d
services:
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  fluent-bit:
    image: fluent/fluent-bit:3.0
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-me
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - loki

# Nota: en producción restringir Grafana a Admin/Analista, TLS y secretos del proveedor.