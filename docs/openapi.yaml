openapi: 3.0.3
info:
  title: Mundo Pinturas Diana Web (MPDW) API
  version: 1.0.0
  description: API REST transaccional para la gestión comercial y multi-sede de MPDW
paths:
  /api/v1/auth/accesos-panel:
    get:
      operationId: auth_accesos_panel
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccesosPanelResponse'
          description: ''
  /api/v1/auth/cambiar-contrasena:
    post:
      operationId: auth_cambiar_contrasena_create
      summary: Cambiar contraseña autenticado
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambiarContrasenaResponse'
          description: ''
  /api/v1/auth/contrato:
    get:
      operationId: auth_contrato_retrieve
      description: Contrato legible para el frontend. No expone secretos.
      summary: Contrato de autenticacion para el frontend
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoAuth'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Autentica usuario y emite JWT corto y cookie HttpOnly con refresh
        token.
      summary: Inicio de sesion
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Revocacion de la familia de refresh tokens y borrado de cookie
        (ADR-006).
      summary: Cierre de sesion
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
          description: ''
  /api/v1/auth/politica-sesion:
    get:
      operationId: auth_politica_sesion_retrieve
      summary: Politica publica de vigencia de sesion
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaSesion'
          description: ''
  /api/v1/auth/profile:
    get:
      operationId: auth_profile_retrieve
      description: Retorna el perfil del usuario autenticado segun JWT.
      summary: Perfil de usuario
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_profile_update
      summary: Actualizar perfil propio (HU 12)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfilUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfilUpdateRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUpdateResponse'
          description: ''
  /api/v1/auth/recuperar:
    post:
      operationId: auth_recuperar_create
      summary: Solicitar enlace de recuperacion
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecuperarRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecuperarRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
          description: ''
  /api/v1/auth/reenviar-2fa:
    post:
      operationId: auth_reenviar_2fa_create
      summary: Reenviar codigo de segundo factor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reenviar2FARequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reenviar2FARequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reenviar2FARequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reenviar2FAResponse'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      summary: Continuar sesion
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/v1/auth/restablecer:
    post:
      operationId: auth_restablecer_create
      summary: Restablecer contraseña con enlace de un solo uso
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RestablecerRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestablecerRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
          description: ''
  /api/v1/auth/verificar-2fa:
    post:
      operationId: auth_verificar_2fa_create
      summary: Verificar codigo de segundo factor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Codigo2FARequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Codigo2FARequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Codigo2FARequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/branches/:
    get:
      operationId: branches_list
      tags:
      - branches
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SedePublic'
          description: ''
  /api/v1/branches/consolidado/:
    get:
      operationId: branches_consolidado_retrieve
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
          description: ''
  /api/v1/branches/gestion/:
    get:
      operationId: branches_gestion_list
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SedePublic'
          description: ''
    post:
      operationId: branches_gestion_create
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearSedeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrearSedeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearSedeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
          description: ''
  /api/v1/branches/gestion/{id_sede}/:
    patch:
      operationId: branches_gestion_partial_update
      parameters:
      - in: path
        name: id_sede
        schema:
          type: integer
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditarSedeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditarSedeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditarSedeRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
          description: ''
  /api/v1/health/live:
    get:
      operationId: health_live_retrieve
      description: Indica si el servidor web HTTP está respondiendo.
      summary: Liveness Probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready_retrieve
      description: Verifica conectividad activa hacia PostgreSQL y Supabase Storage.
      summary: Readiness Probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
          description: ''
  /api/v1/inventory/:
    get:
      operationId: inventory_list
      description: Filtra existencias de inventario por producto y/o sede.
      summary: Consulta de existencias
      parameters:
      - in: query
        name: producto
        schema:
          type: integer
        description: ID del producto
      - in: query
        name: sede
        schema:
          type: integer
        description: ID de la sede
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inventario'
          description: ''
  /api/v1/products/:
    get:
      operationId: products_list
      description: Búsqueda paginada con trigramas y filtrado por categoría.
      summary: Listar o buscar productos
      parameters:
      - in: query
        name: categoria
        schema:
          type: integer
        description: ID de la categoría
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Término de búsqueda
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoResponseList'
          description: ''
    post:
      operationId: products_create
      description: Alta de producto atómica con registro de existencias iniciales
        (TX-07).
      summary: Crear producto
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
          description: ''
  /api/v1/products/{id}/price:
    put:
      operationId: products_price_update
      description: Actualización con concurrencia optimista y motivo obligatorio (TX-06,
        TX-11).
      summary: Actualización de precio (PUT)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoUpdatePrecioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoUpdatePrecioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoUpdatePrecioRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
          description: ''
    patch:
      operationId: products_price_partial_update
      description: Actualización con concurrencia optimista y motivo obligatorio (TX-06,
        TX-11).
      summary: Actualización de precio (PATCH)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductoUpdatePrecioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductoUpdatePrecioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductoUpdatePrecioRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
          description: ''
