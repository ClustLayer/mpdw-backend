components:
  schemas:
    AccesosPanelResponse:
      type: object
      properties:
        modulos:
          type: array
          items:
            type: string
        acciones_por_modulo:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - acciones_por_modulo
      - modulos
    AccionEnum:
      enum:
      - activar
      - desactivar
      - bloquear
      type: string
      description: |-
        * `activar` - activar
        * `desactivar` - desactivar
        * `bloquear` - bloquear
    CambiarContrasenaRequestRequest:
      type: object
      properties:
        password_actual:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 64
        confirmar:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - confirmar
      - password
      - password_actual
    CambiarContrasenaResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        mensaje:
          type: string
        requiere_2fa:
          type: boolean
        redireccion:
          type: string
        desafio_token:
          type: string
          nullable: true
      required:
      - access_token
      - mensaje
      - redireccion
      - requiere_2fa
      - token_type
    CambiarEstadoRequestRequest:
      type: object
      properties:
        accion:
          $ref: '#/components/schemas/AccionEnum'
      required:
      - accion
    CatalogosPermisoResponse:
      type: object
      properties:
        modulos:
          type: array
          items:
            type: object
            additionalProperties: {}
        acciones:
          type: array
          items:
            type: string
      required:
      - acciones
      - modulos
    Codigo2FARequestRequest:
      type: object
      properties:
