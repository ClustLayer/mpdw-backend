# ==============================================================================
# Flujo de Integración Continua (CI) - MPDW Backend
# SAD Ref: K-04, §13.3, §16.1, Regla R8
# ==============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, staging, develop, epica-1-autenticacion, epica-2-administracion-usuarios, epica-3-roles-permisos]
  pull_request:
    branches: [main, staging, develop, epica-1-autenticacion, epica-2-administracion-usuarios, epica-3-roles-permisos]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Puertas de Calidad, Tipos, Arquitectura y Pruebas
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: mpdw_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mpdw_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      MPDW_TEST_USE_POSTGRES: "true"
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/mpdw_test_db
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/mpdw_test_db
      DATABASE_BI_URL: postgresql://postgres:postgres_ci_password@localhost:5432/mpdw_test_db
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-purposes-only-32-chars
      JWT_SIGNING_KEY: ci-jwt-secret-key-for-testing-purposes-only-32-chars

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar uv
        uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
            version: "0.13.6"
            enable-cache: true

      - name: Configurar Python
        run: uv python install 3.13.18

      - name: Instalar dependencias congeladas (uv.lock)
        run: uv sync --frozen

      - name: Habilitar extensión pg_trgm y roles en PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres_ci_password psql -h localhost -U postgres -d mpdw_test_db -c "
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'mpdw_app') THEN
                    CREATE ROLE mpdw_app WITH LOGIN CREATEDB PASSWORD 'test_app_password';
                END IF;
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'mpdw_etl') THEN
                    CREATE ROLE mpdw_etl WITH LOGIN PASSWORD 'test_etl_password';
                END IF;
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'mpdw_migrate') THEN
                    CREATE ROLE mpdw_migrate WITH LOGIN SUPERUSER CREATEDB PASSWORD 'test_migrate_password';
                END IF;
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'mpdw_bi') THEN
                    CREATE ROLE mpdw_bi WITH LOGIN PASSWORD 'test_bi_password';
                END IF;
            END
            \$\$;
          "

      - name: Puerta 0 - Escaneo de secretos
        run: uv run python scripts/scan_secrets.py

      - name: Puerta 1 - Linter y Estilo (Ruff)
        run: uv run ruff check .

      - name: Puerta 2 - Verificación de Tipos Estáticos (Mypy + django-stubs)
        run: uv run mypy apps contratos config etl

      - name: Puerta 3 - Verificación de Contratos de Capas (Import-Linter)
        run: uv run lint-imports

      - name: Puerta 4 - Pruebas Unitarias y Gate de Cobertura en Negocio
        run: >
          uv run pytest tests/unit -m unit
          --cov=apps
          --cov=contratos
          --cov=etl
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Aplicar migraciones sobre base de datos efímera
        run: uv run python manage.py migrate

      - name: Puerta 5 - Pruebas de Integración y Concurrencia (PostgreSQL Real)
        run: uv run pytest tests/integration tests/concurrency

      - name: Puerta 6 - Verificación de Contrato OpenAPI (Sin drift no declarado)
        run: |
          uv run python manage.py spectacular --file /tmp/openapi_generated.yaml
          diff -u docs/openapi.yaml /tmp/openapi_generated.yaml || (echo "El contrato docs/openapi.yaml esta desactualizado. Ejecute spectacular." && exit 1)

      - name: Puerta 7 - Análisis de Seguridad Estática (Bandit)
        run: uv run bandit -r apps config etl contratos -x tests -ll

      - name: Puerta 8 - Auditoría de Vulnerabilidades en Dependencias (pip-audit)
        run: uv run pip-audit || echo "Audit completed with advisories reported"

      - name: Puerta 9 - Construcción de Imagen Docker Etiquetada con Commit
        run: |
          docker build --build-arg COMMIT_SHA=${{ github.sha }} -t mpdw-backend:${{ github.sha }} .

