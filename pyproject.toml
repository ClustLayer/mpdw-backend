[project]
name = "mpdw-backend"
version = "1.1.5"
description = "Backend REST API y ETL de Mundo Pinturas Diana Web (MPDW)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2a1,<5.3",
    "djangorestframework>=3.15.2,<3.18",
    "drf-spectacular>=0.28.0",
    "psycopg[binary]>=3.2.3",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "pillow>=11.1.0",
    "httpx>=0.28.1",
    "gunicorn>=23.0.0",
    "python-dotenv>=1.0.1",
    "dj-database-url>=2.3.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.3",
    "mypy>=1.14.1",
    "django-stubs[compatible-mypy]>=5.1.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15.1",
    "bandit>=1.8.2",
    "pip-audit>=2.7.3",
    "import-linter>=2.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["migrations", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
explicit_package_bases = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.testing"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
markers = [
    "unit: pruebas unitarias puras sin base de datos",
    "integration: pruebas de integracion con base de datos real",
    "concurrency: pruebas de condiciones de carrera con multiples hilos",
]

[tool.coverage.run]
source = ["apps", "contratos", "etl"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/views.py",
    "*/serializers.py",
    "*/repositories.py",
    "*/apps.py",
    "*/models.py",
    "*/authentication.py",
    "*/permissions.py",
    "*/middleware.py",
    "*/pagination.py",
    "*/throttling.py",
    "*/health.py",
    "*/urls.py",
    "*/management/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["apps", "etl"]
include_external_packages = true

# ------------------------------------------------------------------------------
# Contratos por App (M01-M12): Arquitectura en Capas Interna (SAD §6.5)
# ------------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "M01 Identidad: Capas internas (views -> services -> repositories)"
type = "layers"
layers = [
    "apps.m01_identidad.views",
    "apps.m01_identidad.services",
    "apps.m01_identidad.repositories",
]

