# ------------------------------------------------------------------------------
# Contratos de Capas Transversales (SAD §6.5.4)
# ------------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Views no importan repositories directamente (SAD §6.5)"
type = "forbidden"
# allow_indirect_imports = true es requerido porque views -> services -> repositories es la cadena de capas estándar.
# Sin este flag, Import Linter prohíbe el camino indirecto legítimo a través de services.
allow_indirect_imports = true
source_modules = [
    "apps.m01_identidad.views",
    "apps.m02_sedes.views",
    "apps.m03_catalogo.views",
    "apps.m04_inventario.views",
    "apps.m05_clientes.views",
    "apps.m06_ventas.views",
    "apps.m07_domicilios.views",
    "apps.m08_caja.views",
    "apps.m09_analitica.views",
    "apps.m11_eventos.views",
    "apps.m12_tienda_publica.views",
]
forbidden_modules = [
    "apps.m01_identidad.repositories",
    "apps.m02_sedes.repositories",
    "apps.m03_catalogo.repositories",
    "apps.m04_inventario.repositories",
    "apps.m05_clientes.repositories",
    "apps.m06_ventas.repositories",
    "apps.m07_domicilios.repositories",
    "apps.m08_caja.repositories",
    "apps.m09_analitica.repositories",
    "apps.m10_auditoria.repositories",
    "apps.m11_eventos.repositories",
    "apps.m12_tienda_publica.repositories",
]

[[tool.importlinter.contracts]]
name = "Servicios no conocen HTTP (rest_framework ni django.http) (SAD §6.5)"
type = "forbidden"
source_modules = [
    "apps.m01_identidad.services",
    "apps.m02_sedes.services",
    "apps.m03_catalogo.services",
    "apps.m04_inventario.services",
    "apps.m05_clientes.services",
    "apps.m06_ventas.services",
    "apps.m07_domicilios.services",
    "apps.m08_caja.services",
    "apps.m09_analitica.services",
    "apps.m10_auditoria.services",
    "apps.m11_eventos.services",
    "apps.m12_tienda_publica.services",
]
forbidden_modules = [
    "rest_framework",
]

[[tool.importlinter.contracts]]
name = "ETL no conoce HTTP ni vistas (SAD §7.5)"
type = "forbidden"
source_modules = [
    "etl",
]
forbidden_modules = [
    "rest_framework",
    "apps.m01_identidad.views",
    "apps.m02_sedes.views",
    "apps.m03_catalogo.views",
    "apps.m04_inventario.views",
    "apps.m05_clientes.views",
    "apps.m06_ventas.views",
    "apps.m07_domicilios.views",
    "apps.m08_caja.views",
    "apps.m09_analitica.views",
    "apps.m11_eventos.views",
    "apps.m12_tienda_publica.views",
]

[[tool.importlinter.contracts]]
name = "M13 Plataforma adapters no conocen vistas (SAD §6.5)"
type = "forbidden"
source_modules = [
